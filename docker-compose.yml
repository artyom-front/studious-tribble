# SCORES21 — полный стек: приложение + reverse-proxy nginx
# usage: docker compose up -d
services:
  app:
    build: .
    container_name: scores21-app
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=file:/app/db/custom.db
    volumes:
      - scores21-data:/app/db
    # для локального теста без TLS; на проде наружу смотрит только nginx
    ports:
      - "127.0.0.1:3000:3000"

  nginx:
    image: nginx:alpine
    container_name: scores21-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - nginx-www:/var/www/certbot

volumes:
  scores21-data:
  nginx-www:
