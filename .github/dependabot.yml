# Зависимости: еженедельные обновления патч/минорных версий
# Мажорные — отдельным манIFEST-группом с PR на ревью
version: 2

updates:
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 10
    groups:
      patch-and-minor:
        update-types: ["patch", "minor"]
    labels:
      - dependencies
      - automerge-safe
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions самих пайплайнов
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - ci
      - dependencies
    commit-message:
      prefix: "chore(ci)"
