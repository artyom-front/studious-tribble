# ============================================================
# SCORES21 · прод-стек на сервере (/opt/scores21)
# Отличие от docker-compose.yml (dev): app тянется из GHCR по тегу,
# а не собирается локально. Тег задаёт scripts/deploy.sh.
#   TAG=1.2.3 docker compose -f deploy/docker-compose.prod.yml up -d
# Переменные: .env на сервере (AUTH_SECRET, SITE_URL, DATABASE_URL, …)
# ============================================================

services:
  app:
    image: ${DEPLOY_IMAGE:-ghcr.io/ffchuvashia/scores21}:${TAG:-latest}
    container_name: scores21-app
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=file:/app/db/custom.db
      - PORT=3000
    volumes:
      - scores21-data:/app/db
    # наружу смотрит только nginx
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: scores21-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - nginx-www:/var/www/certbot

volumes:
  scores21-data:
  nginx-www:
