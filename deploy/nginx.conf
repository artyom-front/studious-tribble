# SCORES21 — конфиг nginx на ХОСТЕ сервера (не в докере).
# Куда положить: /etc/nginx/sites-available/scores21
# Включить:      ln -s /etc/nginx/sites-available/scores21 /etc/nginx/sites-enabled/
# SSL добавит:   certbot --nginx -d ваш-домен.ru -d www.ваш-домен.ru
# Перед включением замените scores21.ru на ваш домен:
#   sed -i 's/scores21.ru/ваш-домен.ru/g' /etc/nginx/sites-available/scores21

upstream scores21_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name scores21.ru www.scores21.ru;

    # Пусть certbot сам добавит SSL-блок (certbot --nginx) — эти строки он
    # перепишет на редирект 301 -> https автоматически.

    # безопасность
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # gzip для текстовых ассетов (HTML/JSON/JS/CSS)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 2m;

    location / {
        proxy_pass http://scores21_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";   # задел под WebSocket (live-счёт, M5)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # статика Next.js иммутабельна — кэшируем агрессивно
    location /_next/static/ {
        proxy_pass http://scores21_app;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
