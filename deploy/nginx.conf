# SCORES21 — reverse-proxy nginx (прод-конфиг)
# TLS-сертификаты кладутся в deploy/certs/ (fullchain.pem / privkey.pem)
# Рекомендуемый путь: certbot certonly --webroot -w /var/www/certbot -d scores21.ru

upstream scores21_app {
    server app:3000;
    keepalive 32;
}

# HTTP -> HTTPS + ACME-challenge для Let's Encrypt
server {
    listen 80;
    server_name scores21.ru www.scores21.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name scores21.ru www.scores21.ru;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # безопасность
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # gzip для текстовых ассетов
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 2m;

    location / {
        proxy_pass http://scores21_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";   # задел под WebSocket (live-счёт, M5)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # статика Next.js иммутабельна — кэшируем агрессивно
    location /_next/static/ {
        proxy_pass http://scores21_app;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # health-check наружу не светим — только для мониторинга изнутри
    location = /api/health {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
        proxy_pass http://scores21_app;
    }
}
